name: Edit reviewed incident

on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: "修正対象の案件ID（必須）"
        required: true
        type: string
      published:
        description: "公表日 (YYYY-MM-DD) ※空欄なら変更なし"
        required: false
        default: ""
        type: string
      company:
        description: "企業・団体名 ※空欄なら変更なし"
        required: false
        default: ""
        type: string
      service:
        description: "サービス名 ※空欄なら変更なし"
        required: false
        default: ""
        type: string
      affected_count:
        description: "対象規模 ※空欄なら変更なし（4,454,097件 でも可）"
        required: false
        default: ""
        type: string
      status:
        description: "確認状況 ※未選択なら変更なし"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - confirmed
          - possible
      cause:
        description: "原因・分類 ※空欄なら変更なし"
        required: false
        default: ""
        type: string
      summary:
        description: "案件概要 ※空欄なら変更なし"
        required: false
        default: ""
        type: string
      exposed_data:
        description: "漏えい・対象情報 ※空欄なら変更なし"
        required: false
        default: ""
        type: string
      sources_json:
        description: "情報源JSON ※空欄なら変更なし。編集フォームからコピー"
        required: false
        default: ""
        type: string
      official_url:
        description: "旧方式: 公式発表URL ※通常は空欄"
        required: false
        default: ""
        type: string
      source_name:
        description: "旧方式: 公式情報源名 ※通常は空欄"
        required: false
        default: ""
        type: string
      note:
        description: "確認・修正メモ ※空欄なら変更なし"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-leak-data-write
  cancel-in-progress: false

jobs:
  edit-reviewed-incident:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot public incidents before edit
        run: python scripts/report_public_changes.py snapshot /tmp/public-before.json

      - name: Edit reviewed incident
        env:
          INCIDENT_ID: ${{ inputs.incident_id }}
          PUBLISHED: ${{ inputs.published }}
          COMPANY: ${{ inputs.company }}
          SERVICE: ${{ inputs.service }}
          AFFECTED_COUNT: ${{ inputs.affected_count }}
          STATUS: ${{ inputs.status }}
          CAUSE: ${{ inputs.cause }}
          SUMMARY: ${{ inputs.summary }}
          EXPOSED_DATA: ${{ inputs.exposed_data }}
          SOURCES_JSON: ${{ inputs.sources_json }}
          OFFICIAL_URL: ${{ inputs.official_url }}
          SOURCE_NAME: ${{ inputs.source_name }}
          NOTE: ${{ inputs.note }}
        run: |
          python scripts/edit_reviewed_incident.py \
            --id "$INCIDENT_ID" \
            --published "$PUBLISHED" \
            --company "$COMPANY" \
            --service "$SERVICE" \
            --affected-count "$AFFECTED_COUNT" \
            --status "$STATUS" \
            --cause "$CAUSE" \
            --summary "$SUMMARY" \
            --exposed-data "$EXPOSED_DATA" \
            --sources-json "$SOURCES_JSON" \
            --official-url "$OFFICIAL_URL" \
            --source-name "$SOURCE_NAME" \
            --note "$NOTE"

      - name: Check official follow-up announcements
        run: python scripts/check_official_updates.py

      - name: Normalize source media names
        run: python scripts/normalize_source_names.py

      - name: Generate public feed
        run: python scripts/export_public.py

      - name: Report public changes
        run: python scripts/report_public_changes.py report /tmp/public-before.json

      - name: Commit changes
        run: |
          git config user.name "privacy-leak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/public-incidents.json data/public-update.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "review: edit reviewed incident ${{ inputs.incident_id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
