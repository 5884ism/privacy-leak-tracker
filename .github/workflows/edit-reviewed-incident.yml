name: Edit reviewed incident

on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: "修正対象の案件ID（必須）"
        required: true
        type: string
      published:
        description: "公表日"
        required: false
        default: ""
        type: string
      company:
        description: "企業・団体名"
        required: false
        default: ""
        type: string
      service:
        description: "サービス名"
        required: false
        default: ""
        type: string
      affected_count:
        description: "対象規模"
        required: false
        default: ""
        type: string
      status:
        description: "確認状況"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - confirmed
          - possible
      cause:
        description: "原因・分類"
        required: false
        default: ""
        type: string
      summary:
        description: "案件概要"
        required: false
        default: ""
        type: string
      exposed_data:
        description: "漏えい・対象情報"
        required: false
        default: ""
        type: string
      sources_json:
        description: "情報源JSON"
        required: false
        default: ""
        type: string
      note:
        description: "確認・修正メモ"
        required: false
        default: ""
        type: string
      merge_ids_json:
        description: "親案件へ追加で紐づける候補ID JSON"
        required: false
        default: "[]"
        type: string
      affected_organizations_json:
        description: "影響組織JSON"
        required: false
        default: "[]"
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-leak-data-write
  cancel-in-progress: false

jobs:
  edit-reviewed-incident:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot public incidents before edit
        run: python scripts/report_public_changes.py snapshot /tmp/public-before.json

      - name: Edit reviewed incident
        env:
          INCIDENT_ID: ${{ inputs.incident_id }}
          PUBLISHED: ${{ inputs.published }}
          COMPANY: ${{ inputs.company }}
          SERVICE: ${{ inputs.service }}
          AFFECTED_COUNT: ${{ inputs.affected_count }}
          STATUS: ${{ inputs.status }}
          CAUSE: ${{ inputs.cause }}
          SUMMARY: ${{ inputs.summary }}
          EXPOSED_DATA: ${{ inputs.exposed_data }}
          SOURCES_JSON: ${{ inputs.sources_json }}
          NOTE: ${{ inputs.note }}
        run: |
          python scripts/edit_reviewed_incident.py \
            --id "$INCIDENT_ID" \
            --published "$PUBLISHED" \
            --company "$COMPANY" \
            --service "$SERVICE" \
            --affected-count "$AFFECTED_COUNT" \
            --status "$STATUS" \
            --cause "$CAUSE" \
            --summary "$SUMMARY" \
            --exposed-data "$EXPOSED_DATA" \
            --sources-json "$SOURCES_JSON" \
            --note "$NOTE"

      - name: Attach candidate incidents to reviewed parent
        if: ${{ inputs.merge_ids_json != '[]' && inputs.merge_ids_json != '' }}
        env:
          INCIDENT_ID: ${{ inputs.incident_id }}
          MERGE_IDS_JSON: ${{ inputs.merge_ids_json }}
          AFFECTED_ORGS: ${{ inputs.affected_organizations_json }}
          NOTE: ${{ inputs.note }}
        run: |
          python scripts/merge_candidates.py \
            --mode existing \
            --parent-id "$INCIDENT_ID" \
            --merge-ids-json "$MERGE_IDS_JSON" \
            --affected-organizations-json "$AFFECTED_ORGS" \
            --note "$NOTE"

      - name: Check official follow-up announcements
        run: python scripts/check_official_updates.py

      - name: Normalize source media names
        run: python scripts/normalize_source_names.py

      - name: Generate public feed
        run: python scripts/export_public.py

      - name: Generate public news
        run: python scripts/export_public_news.py

      - name: Report public changes
        run: python scripts/report_public_changes.py report /tmp/public-before.json

      - name: Commit changes
        run: |
          git config user.name "privacy-leak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/public-incidents.json data/public-update.json data/public-news.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "review: edit reviewed incident ${{ inputs.incident_id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
