name: Review official updates

on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: "案件ID"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-leak-data-write
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Mark official updates reviewed
        run: python scripts/review_official_updates.py --id "${{ inputs.incident_id }}"
      - name: Commit changes
        run: |
          git config user.name "privacy-leak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "review: official updates ${{ inputs.incident_id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
