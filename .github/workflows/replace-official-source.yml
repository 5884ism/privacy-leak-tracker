name: Replace official source

on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: "確認済み案件の案件ID"
        required: true
        type: string
      old_url:
        description: "削除する誤った公式発表URL"
        required: true
        type: string
      new_url:
        description: "正しい公式発表URL"
        required: true
        type: string
      source_name:
        description: "公式情報源の表示名"
        required: false
        default: "公式発表"
        type: string
      note:
        description: "修正理由・運用メモ（任意）"
        required: false
        default: "誤登録した公式URLを修正"
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-leak-data-write
  cancel-in-progress: false

jobs:
  replace-official-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot public incidents before correction
        run: python scripts/report_public_changes.py snapshot /tmp/public-before.json

      - name: Replace official source
        env:
          INCIDENT_ID: ${{ inputs.incident_id }}
          OLD_URL: ${{ inputs.old_url }}
          NEW_URL: ${{ inputs.new_url }}
          SOURCE_NAME: ${{ inputs.source_name }}
          NOTE: ${{ inputs.note }}
        run: |
          python scripts/replace_official_source.py \
            --id "$INCIDENT_ID" \
            --old-url "$OLD_URL" \
            --new-url "$NEW_URL" \
            --source-name "$SOURCE_NAME" \
            --note "$NOTE"

      - name: Check official follow-up announcements
        run: python scripts/check_official_updates.py

      - name: Normalize source media names
        run: python scripts/normalize_source_names.py

      - name: Generate public feed
        run: python scripts/export_public.py

      - name: Report public changes
        run: python scripts/report_public_changes.py report /tmp/public-before.json

      - name: Commit changes
        run: |
          git config user.name "privacy-leak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/public-incidents.json data/public-update.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "review: replace official source ${{ inputs.incident_id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
