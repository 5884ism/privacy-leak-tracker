name: Merge candidate incidents

on:
  workflow_dispatch:
    inputs:
      primary_id:
        description: "統合後に残す親案件ID"
        required: true
        type: string
      merge_ids_json:
        description: "統合する案件IDのJSON配列"
        required: true
        type: string
      company:
        description: "統合後の企業・委託先名"
        required: true
        type: string
      service:
        description: "サービス/システム名"
        required: false
        default: ""
        type: string
      published:
        description: "公表日"
        required: false
        default: ""
        type: string
      affected_count:
        description: "統合後の対象規模"
        required: false
        default: ""
        type: string
      cause:
        description: "原因・分類"
        required: false
        default: ""
        type: string
      summary:
        description: "統合後の案件概要"
        required: false
        default: ""
        type: string
      exposed_data:
        description: "漏えい・対象情報"
        required: false
        default: ""
        type: string
      affected_organizations_json:
        description: "影響組織JSON配列"
        required: false
        default: "[]"
        type: string
      note:
        description: "統合理由・メモ"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-leak-data-write
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Merge candidates
        env:
          PRIMARY_ID: ${{ inputs.primary_id }}
          MERGE_IDS_JSON: ${{ inputs.merge_ids_json }}
          COMPANY: ${{ inputs.company }}
          SERVICE: ${{ inputs.service }}
          PUBLISHED: ${{ inputs.published }}
          AFFECTED_COUNT: ${{ inputs.affected_count }}
          CAUSE: ${{ inputs.cause }}
          SUMMARY: ${{ inputs.summary }}
          EXPOSED_DATA: ${{ inputs.exposed_data }}
          AFFECTED_ORGS: ${{ inputs.affected_organizations_json }}
          NOTE: ${{ inputs.note }}
        run: |
          python scripts/merge_candidates.py \
            --primary-id "$PRIMARY_ID" \
            --merge-ids-json "$MERGE_IDS_JSON" \
            --company "$COMPANY" \
            --service "$SERVICE" \
            --published "$PUBLISHED" \
            --affected-count "$AFFECTED_COUNT" \
            --cause "$CAUSE" \
            --summary "$SUMMARY" \
            --exposed-data "$EXPOSED_DATA" \
            --affected-organizations-json "$AFFECTED_ORGS" \
            --note "$NOTE"

      - name: Commit change
        run: |
          git config user.name "privacy-leak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git commit -m "review: merge candidate incidents ${{ inputs.primary_id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
