name: Merge candidate incidents

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "existing=既存確定案件へ紐づけ / new=新しい親候補を作成"
        required: true
        default: "existing"
        type: choice
        options: [existing, new]
      parent_id:
        description: "既存親案件ID（mode=existing時）"
        required: false
        default: ""
        type: string
      merge_ids_json:
        description: "紐づける候補案件IDのJSON配列"
        required: true
        type: string
      company:
        description: "親案件の企業・委託先名"
        required: false
        default: ""
        type: string
      service:
        description: "サービス/システム名"
        required: false
        default: ""
        type: string
      published:
        description: "公表日"
        required: false
        default: ""
        type: string
      affected_count:
        description: "対象規模"
        required: false
        default: ""
        type: string
      cause:
        description: "原因・分類"
        required: false
        default: ""
        type: string
      summary:
        description: "案件概要"
        required: false
        default: ""
        type: string
      exposed_data:
        description: "漏えい・対象情報"
        required: false
        default: ""
        type: string
      affected_organizations_json:
        description: "影響組織JSON配列"
        required: false
        default: "[]"
        type: string
      note:
        description: "統合/紐づけ理由"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-leak-data-write
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot public incidents before linking
        run: python scripts/report_public_changes.py snapshot /tmp/public-before.json

      - name: Link or merge candidate incidents
        env:
          MODE: ${{ inputs.mode }}
          PARENT_ID: ${{ inputs.parent_id }}
          MERGE_IDS_JSON: ${{ inputs.merge_ids_json }}
          COMPANY: ${{ inputs.company }}
          SERVICE: ${{ inputs.service }}
          PUBLISHED: ${{ inputs.published }}
          AFFECTED_COUNT: ${{ inputs.affected_count }}
          CAUSE: ${{ inputs.cause }}
          SUMMARY: ${{ inputs.summary }}
          EXPOSED_DATA: ${{ inputs.exposed_data }}
          AFFECTED_ORGS: ${{ inputs.affected_organizations_json }}
          NOTE: ${{ inputs.note }}
        run: |
          python scripts/merge_candidates.py \
            --mode "$MODE" \
            --parent-id "$PARENT_ID" \
            --merge-ids-json "$MERGE_IDS_JSON" \
            --company "$COMPANY" \
            --service "$SERVICE" \
            --published "$PUBLISHED" \
            --affected-count "$AFFECTED_COUNT" \
            --cause "$CAUSE" \
            --summary "$SUMMARY" \
            --exposed-data "$EXPOSED_DATA" \
            --affected-organizations-json "$AFFECTED_ORGS" \
            --note "$NOTE"

      - name: Normalize source media names
        run: python scripts/normalize_source_names.py

      - name: Generate public feed
        run: python scripts/export_public.py

      - name: Report public changes
        run: python scripts/report_public_changes.py report /tmp/public-before.json

      - name: Commit changes
        run: |
          git config user.name "privacy-leak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/public-incidents.json data/public-update.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "review: link candidate incidents"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
