name: Promote incident

on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: "候補案件ID"
        required: true
        type: string
      status:
        description: "確認状況"
        required: true
        default: "confirmed"
        type: choice
        options: [confirmed, possible]
      published:
        description: "公表日"
        required: false
        default: ""
        type: string
      company:
        description: "企業・団体名"
        required: false
        default: ""
        type: string
      service:
        description: "サービス名"
        required: false
        default: ""
        type: string
      affected_count:
        description: "対象規模"
        required: false
        default: ""
        type: string
      cause:
        description: "原因・分類"
        required: false
        default: ""
        type: string
      summary:
        description: "案件概要"
        required: false
        default: ""
        type: string
      exposed_data:
        description: "漏えい・対象情報"
        required: false
        default: ""
        type: string
      sources_json:
        description: "情報源JSON"
        required: false
        default: "[]"
        type: string
      note:
        description: "確認メモ"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: privacy-leak-data-write
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot public incidents before promotion
        run: python scripts/report_public_changes.py snapshot /tmp/public-before.json

      - name: Promote incident
        env:
          INCIDENT_ID: ${{ inputs.incident_id }}
          STATUS: ${{ inputs.status }}
          PUBLISHED: ${{ inputs.published }}
          COMPANY: ${{ inputs.company }}
          SERVICE: ${{ inputs.service }}
          AFFECTED_COUNT: ${{ inputs.affected_count }}
          CAUSE: ${{ inputs.cause }}
          SUMMARY: ${{ inputs.summary }}
          EXPOSED_DATA: ${{ inputs.exposed_data }}
          SOURCES_JSON: ${{ inputs.sources_json }}
          NOTE: ${{ inputs.note }}
        run: |
          python scripts/promote.py \
            --id "$INCIDENT_ID" \
            --status "$STATUS" \
            --published "$PUBLISHED" \
            --company "$COMPANY" \
            --service "$SERVICE" \
            --affected-count "$AFFECTED_COUNT" \
            --cause "$CAUSE" \
            --summary "$SUMMARY" \
            --exposed-data "$EXPOSED_DATA" \
            --sources-json "$SOURCES_JSON" \
            --note "$NOTE"

      - name: Normalize source media names
        run: python scripts/normalize_source_names.py

      - name: Generate public feed
        run: python scripts/export_public.py

      - name: Report public changes
        run: python scripts/report_public_changes.py report /tmp/public-before.json

      - name: Commit changes
        run: |
          git config user.name "privacy-leak-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/public-incidents.json data/public-update.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "review: promote incident ${{ inputs.incident_id }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
